[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipping-billing-agent"
version = "0.1.0"
description = "Multi-format shipping bill extraction and reconciliation agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "requests>=2.31",
  "PyYAML>=6.0",
  "pypdf>=4.2",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "python-docx>=1.1",
  "langchain>=0.3,<1.0",
  "langchain-anthropic>=0.3,<1.0",
  "langchain-openai>=0.3,<1.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "jsonschema>=4.22"]

[project.scripts]
shipping-billing = "shipping_billing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that call external OCR or LLM services",
]
